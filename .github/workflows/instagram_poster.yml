name: Poster Instagram

on:
  schedule:
    # Minutes décalées : :00/:15/:30/:45 sont les créneaux que GitHub retarde le plus.
    - cron: "7,22,37,52 * * * *"  # toutes les 15 minutes
  workflow_dispatch:         # manuel + publication directe (sidebar ⚡)

# Un run déclenché (publication directe) et un run du cron ne doivent jamais se
# chevaucher : chacun publierait le même payload. Le second attend le premier…
concurrency:
  group: instagram-poster
  cancel-in-progress: false

jobs:
  post_instagram:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write   # pour créer une issue GitHub en cas d'échec

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # … et relit la pointe de main (pas le commit du déclenchement) pour
          # voir le published.json écrit par le premier.
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Process Instagram Payloads
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CYBERPUNK_STORY_ACCESS_TOKEN: ${{ secrets.CYBERPUNK_STORY_ACCESS_TOKEN }}
          CYBERPUNK_STORY_THREADS_TOKEN: ${{ secrets.CYBERPUNK_STORY_THREADS_TOKEN }}
          CYBERPUNK_STORY_BUFFER_API_KEY: ${{ secrets.CYBERPUNK_STORY_BUFFER_API_KEY }}
          IA_ACTUS_ACCESS_TOKEN: ${{ secrets.IA_ACTUS_ACCESS_TOKEN }}
          IA_ACTUS_THREADS_TOKEN: ${{ secrets.IA_ACTUS_THREADS_TOKEN }}
          IA_ACTUS_BUFFER_API_KEY: ${{ secrets.IA_ACTUS_BUFFER_API_KEY }}
          MEOWGINEEREDAI_ACCESS_TOKEN: ${{ secrets.MEOWGINEEREDAI_ACCESS_TOKEN }}
          MEOWGINEEREDAI_THREADS_TOKEN: ${{ secrets.MEOWGINEEREDAI_THREADS_TOKEN }}
          MEOWGINEEREDAI_BUFFER_API_KEY: ${{ secrets.MEOWGINEEREDAI_BUFFER_API_KEY }}
          MINIATURE_ACCESS_TOKEN: ${{ secrets.MINIATURE_ACCESS_TOKEN }}
          MINIATURE_THREADS_TOKEN: ${{ secrets.MINIATURE_THREADS_TOKEN }}
          MINIATURE_BUFFER_API_KEY: ${{ secrets.MINIATURE_BUFFER_API_KEY }}
          CYBERPUNK_STORY_FACEBOOK_ID: ${{ vars.CYBERPUNK_STORY_FACEBOOK_ID }}
          CYBERPUNK_STORY_INSTAGRAM_ID: ${{ vars.CYBERPUNK_STORY_INSTAGRAM_ID }}
          CYBERPUNK_STORY_THREADS_ID: ${{ vars.CYBERPUNK_STORY_THREADS_ID }}
          CYBERPUNK_STORY_THREADS_TOKEN_EXPIRES: ${{ vars.CYBERPUNK_STORY_THREADS_TOKEN_EXPIRES }}
          CYBERPUNK_STORY_BUFFER_TIKTOK_CHANNEL_ID: ${{ vars.CYBERPUNK_STORY_BUFFER_TIKTOK_CHANNEL_ID }}
          CYBERPUNK_STORY_BUFFER_YOUTUBE_CHANNEL_ID: ${{ vars.CYBERPUNK_STORY_BUFFER_YOUTUBE_CHANNEL_ID }}
          IA_ACTUS_FACEBOOK_ID: ${{ vars.IA_ACTUS_FACEBOOK_ID }}
          IA_ACTUS_INSTAGRAM_ID: ${{ vars.IA_ACTUS_INSTAGRAM_ID }}
          IA_ACTUS_THREADS_ID: ${{ vars.IA_ACTUS_THREADS_ID }}
          IA_ACTUS_THREADS_TOKEN_EXPIRES: ${{ vars.IA_ACTUS_THREADS_TOKEN_EXPIRES }}
          IA_ACTUS_BUFFER_TIKTOK_CHANNEL_ID: ${{ vars.IA_ACTUS_BUFFER_TIKTOK_CHANNEL_ID }}
          IA_ACTUS_BUFFER_YOUTUBE_CHANNEL_ID: ${{ vars.IA_ACTUS_BUFFER_YOUTUBE_CHANNEL_ID }}
          MEOWGINEEREDAI_FACEBOOK_ID: ${{ vars.MEOWGINEEREDAI_FACEBOOK_ID }}
          MEOWGINEEREDAI_INSTAGRAM_ID: ${{ vars.MEOWGINEEREDAI_INSTAGRAM_ID }}
          MEOWGINEEREDAI_THREADS_ID: ${{ vars.MEOWGINEEREDAI_THREADS_ID }}
          MEOWGINEEREDAI_THREADS_TOKEN_EXPIRES: ${{ vars.MEOWGINEEREDAI_THREADS_TOKEN_EXPIRES }}
          MEOWGINEEREDAI_BUFFER_TIKTOK_CHANNEL_ID: ${{ vars.MEOWGINEEREDAI_BUFFER_TIKTOK_CHANNEL_ID }}
          MEOWGINEEREDAI_BUFFER_YOUTUBE_CHANNEL_ID: ${{ vars.MEOWGINEEREDAI_BUFFER_YOUTUBE_CHANNEL_ID }}
          MINIATURE_FACEBOOK_ID: ${{ vars.MINIATURE_FACEBOOK_ID }}
          MINIATURE_INSTAGRAM_ID: ${{ vars.MINIATURE_INSTAGRAM_ID }}
          MINIATURE_THREADS_ID: ${{ vars.MINIATURE_THREADS_ID }}
          MINIATURE_THREADS_TOKEN_EXPIRES: ${{ vars.MINIATURE_THREADS_TOKEN_EXPIRES }}
          MINIATURE_BUFFER_TIKTOK_CHANNEL_ID: ${{ vars.MINIATURE_BUFFER_TIKTOK_CHANNEL_ID }}
          MINIATURE_BUFFER_YOUTUBE_CHANNEL_ID: ${{ vars.MINIATURE_BUFFER_YOUTUBE_CHANNEL_ID }}

        run: |
          echo "[REFRESH] Lancement du script de publication Instagram..."
          python scripts/process_payloads.py

      - name: Notify on failure
        if: failure() && steps.publish.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date().toLocaleString('fr-CH', {timeZone: 'Europe/Zurich'});
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `⚠️ Publication Instagram échouée — ${now}`,
              body:  `Des erreurs ont été détectées lors de la publication automatique.\n\n` +
                     `👉 [Voir les logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: []
            });
